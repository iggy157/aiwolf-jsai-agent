# 日本語見出しラベル.
# prompts/jp/<name>.jinja の <name> に対応する日本語の見出し文字列を定義する.
# 未定義のブロックはファイル名 (stem) がそのまま見出しに使われる.
#
# サブディレクトリ配下のブロックはネストした dict で書く. block('thread/summary')
# は labels['thread']['summary'] = 'スレッド一覧' に対応する.

history: 履歴
instruction: 指示
identity: 話者情報
event: イベント
constraints: 出力制約
daily_objective: 本日の目標
game_state: ゲーム状況
rules: ルール
thread:
  summary: スレッド一覧
  history: スレッド別履歴
  diff: 新着発話 (前回送信以降)
  decision: 判断指示 (Step A)
  context: 判断結果
  assign: スレッド割当推定
